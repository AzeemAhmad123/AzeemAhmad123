<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Azeem Ahmad — Software Engineer</title><desc id="desc">Computer vision, applied AI and full-stack development. An animated illustration connects tracked objects to usable software.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset=".55" stop-color="#11172b"/><stop offset="1" stop-color="#162038"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#b8a6ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#6547b8" stop-opacity=".24"/><stop offset="1" stop-color="#6547b8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9caecc" stroke-opacity=".065"/></pattern>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Monaco,monospace}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-9px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(125px)}100%{transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes cursor{0%,45%{opacity:1}50%,95%{opacity:0}}
.track{animation:drift 7s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{animation:flow 3s linear infinite}.cursor{animation:cursor 1.2s steps(1) infinite}
@media(prefers-reduced-motion:reduce){.track,.scan,.pulse,.flow,.cursor{animation:none}}
</style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect width="1200" height="420" rx="24" fill="url(#grid)"/>
<ellipse cx="1050" cy="90" rx="380" ry="310" fill="url(#glow)"/>
<rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
<g transform="translate(52 55)">
<rect width="238" height="28" rx="14" fill="#19312f" stroke="#2d625c"/><circle cx="17" cy="14" r="4" fill="#5eead4" class="pulse"/>
<text x="30" y="19" font-size="12" letter-spacing="2" fill="#91f4dc">SOFTWARE ENGINEER</text>
<text y="105" font-size="65" font-weight="700" letter-spacing="-2.5" fill="#f3f7ff">Azeem Ahmad<tspan fill="#7ee7e0">.</tspan></text>
<text y="155" font-size="31" font-weight="600" letter-spacing="-.5" fill="url(#accent)">I build software that sees.</text>
<text y="195" font-size="18" fill="#a9b8cf">From video and data to products people can use.</text>
<g transform="translate(0 224)" font-size="13" fill="#cfdaee" class="mono">
<rect width="157" height="34" rx="8" fill="#172539" stroke="#2e435b"/><text x="15" y="22">Computer Vision</text>
<rect x="168" width="116" height="34" rx="8" fill="#1f213b" stroke="#41415f"/><text x="183" y="22">Applied AI</text>
<rect x="295" width="118" height="34" rx="8" fill="#182b34" stroke="#2b4854"/><text x="310" y="22">Full Stack</text>
</g>
<text y="311" font-size="13" letter-spacing="2" fill="#7286a4" class="mono">PYTHON / YOLO / OPENCV / REACT / TYPESCRIPT</text>
</g>
<g transform="translate(745 52)">
<rect width="401" height="308" rx="15" fill="#0b1322" stroke="#34415e"/>
<path d="M0 40H401" stroke="#26334a"/><circle cx="21" cy="21" r="4.5" fill="#fb7185"/><circle cx="38" cy="21" r="4.5" fill="#fbbf24"/><circle cx="55" cy="21" r="4.5" fill="#5eead4"/>
<text x="81" y="26" fill="#98a9c3" font-size="12" class="mono">vision_to_product.py</text>
<rect x="24" y="59" width="353" height="153" rx="8" fill="#101e30"/>
<path d="M24 182L113 134 188 168 278 101 377 144M24 110L117 164 212 93 305 175 377 127" fill="none" stroke="#263d58"/>
<path d="M199 60V211M24 136H377" stroke="#263d58" stroke-dasharray="3 7"/>
<g class="track">
<rect x="91" y="95" width="61" height="83" rx="4" fill="#5eead4" fill-opacity=".07" stroke="#5eead4" stroke-width="2"/>
<path d="M91 110V95H106M137 95H152V110M91 163V178H106M137 178H152V163" fill="none" stroke="#b4fff2" stroke-width="3"/>
<circle cx="121" cy="115" r="8" fill="#5eead4" opacity=".8"/><path d="M121 127V150M121 133L106 146M121 133L136 146M121 150L110 170M121 150L132 170" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
<rect x="91" y="78" width="61" height="17" rx="3" fill="#5eead4"/><text x="97" y="90" fill="#092322" font-size="10" class="mono">track_01</text>
</g>
<g class="pulse"><rect x="254" y="96" width="47" height="60" rx="4" fill="#b8a6ff" fill-opacity=".08" stroke="#b8a6ff" stroke-width="2"/><circle cx="278" cy="117" r="8" fill="#b8a6ff"/><path d="M278 129V144M278 132L264 142M278 132L291 142" stroke="#b8a6ff" stroke-width="3"/></g>
<path d="M37 70H364" stroke="#67e8f9" stroke-opacity=".6" class="scan"/>
<g class="mono" font-size="13"><text x="25" y="241" fill="#899db8">&gt; detect <tspan fill="#5eead4">→</tspan> track <tspan fill="#5eead4">→</tspan> understand</text><text x="25" y="268" fill="#b8a6ff">&gt; build something useful<tspan class="cursor" fill="#5eead4"> _</tspan></text></g>
</g>
<path d="M685 236H731" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 12" class="flow"/>
<text x="1145" y="390" text-anchor="end" font-size="10" letter-spacing="2" fill="#687f9e" class="mono">VISION → INTELLIGENCE → EXPERIENCE</text>
</svg>

